name: Build SukiSU Kernel (thyme)

on:
  workflow_dispatch:

jobs:
  build-thyme:
    name: Build thyme | SukiSU v4.3.0-r1 | MIUI
    # 固定 24.04：26.04 (resolute) 已把 libxml2 升到 soname 16，
    # 预编译 zyc-clang 的 ld.lld 硬依赖 libxml2.so.2，在 26.04 上必挂。
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Environment (core deps)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex gawk git gnupg gperf \
            imagemagick libncurses-dev libssl-dev libxml2-utils lz4 lzop \
            device-tree-compiler rsync schedtool squashfs-tools xsltproc \
            zip unzip zlib1g-dev python3

      - name: Set up Environment (optional deps, non-fatal)
        run: |
          sudo apt-get install -y lib32readline-dev lib32z1-dev libsdl1.2-dev \
            pngcrush || echo "::warning::some optional apt packages unavailable on this runner"
          echo "--- required tool check ---"
          for t in bc bison flex gcc make ccache lz4 lzop dtc zip; do
            printf '%-8s ' "$t"; command -v "$t" || echo MISSING
          done

      - name: Runtime libs for prebuilt clang/lld
        run: |
          echo "--- apt candidates named libxml2* ---"
          apt-cache search --names-only '^libxml2' || true
          for p in libxml2 libxml2-16 libxml2-2 libxml2t64 libxml2-shlibs libxml2-dev; do
            sudo apt-get install -y "$p" >/dev/null 2>&1 && echo "installed: $p" || echo "skip: $p"
          done
          sudo apt-get install -y lld || true
          echo "--- ldconfig libxml2 ---"
          ldconfig -p | grep -i libxml2 || echo "libxml2 STILL MISSING"
          echo "--- lld sanity ---"
          ~/zyc-clang/bin/ld.lld --version || echo "zyc ld.lld BROKEN"
          ld.lld --version || true

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache_mikernel
          key: ${{ runner.os }}-kernel-ccache-thyme-sukisu-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-kernel-ccache-thyme-sukisu-
            ${{ runner.os }}-kernel-ccache-thyme-

      - name: Fetch kernel source (android17-aptusitu)
        run: |
          curl -L --retry 5 -o src.tar.gz https://codeload.github.com/AstideLabs/android_kernel_xiaomi_sm8250/tar.gz/refs/heads/android17-aptusitu
          ls -l src.tar.gz
          mkdir -p kernel
          tar -xzf src.tar.gz -C kernel --strip-components=1
          ls kernel | head -40
          test -f kernel/arch/arm64/configs/thyme_defconfig

      - name: Setup zyc-clang 16 Toolchain
        run: |
          mkdir -p $HOME/zyc-clang
          cd $HOME/zyc-clang
          wget -q https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260807-release/Clang-16.0.6-20260807.tar.gz
          tar -zxvf Clang-16.0.6-20260807.tar.gz
          $HOME/zyc-clang/bin/clang --version

      - name: Build kernel with SukiSU
        run: |
          ccache -M 10G
          cd kernel
          chmod +x ../build_kernel.sh
          bash ../build_kernel.sh thyme ksu miui

      - name: Collect outputs
        if: always()
        run: |
          echo "=== build outputs ==="
          ls -l kernel/APTKernel_*.zip || true
          ls -l kernel/out_miui/arch/arm64/boot/ || true
          if [ -f kernel/out_miui/.config ]; then
            echo "=== KSU/KPROBES lines in .config ==="
            grep -E '^CONFIG_(KSU|KPROBES|KALLSYMS|KALLSYMS_ALL|EXT4_FS|MODULES)' kernel/out_miui/.config || true
          fi

      - name: Upload flashable ZIP + raw Image
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: SukiSU-thyme-${{ github.run_id }}
          path: |
            kernel/APTKernel_*.zip
            kernel/out_miui/arch/arm64/boot/Image
            kernel/out_miui/arch/arm64/boot/dtb
            kernel/out_miui/arch/arm64/boot/dtbo.img
            kernel/out_miui/.config
          compression-level: 0
          if-no-files-found: warn
